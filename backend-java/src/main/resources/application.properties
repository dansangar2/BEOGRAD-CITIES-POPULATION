server.address=127.0.0.1
server.port=${BEOGRAD_JAVA_PORT:8000}
beograd.media-root=${BEOGRAD_MEDIA_ROOT:}
server.tomcat.connection-timeout=10s
server.tomcat.keep-alive-timeout=15s
server.tomcat.max-connections=128
server.tomcat.threads.max=16
server.tomcat.max-http-form-post-size=2MB
server.max-http-request-header-size=16KB
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=5s
spring.application.name=beograd-api
spring.main.banner-mode=off
spring.jackson.default-property-inclusion=always
spring.web.resources.add-mappings=false
server.error.include-message=never
server.error.include-stacktrace=never
beograd.database=${BEOGRAD_DATABASE:}
beograd.catalog=${BEOGRAD_CATALOG:}
