{% extends "ciudades_del_mundo/base.html" %}
{% load i18n %}

{% block title %}{% trans "Países - Ciudades del Mundo" %}{% endblock %}

{% block content %}
<section class="page-head compact">
  <div>
    <p class="eyebrow">{% trans "Estadísticas" %}</p>
    <h1>{% trans "Países" %}</h1>
  </div>
</section>

<section class="panel">
  <div
    class="stats-country-browser"
    data-stats-countries
    data-url="{{ stats_countries_url }}"
    data-loading="{% trans 'Cargando datos...' %}"
    data-error="{% trans 'No se pudieron cargar los países.' %}"
    data-empty="{% trans 'Sin datos' %}"
    data-population-label="{% trans 'Población' %}"
    data-area-label="{% trans 'Terreno' %}"
    data-general-title="{% trans 'Datos generales del país' %}"
    data-children-title="{% trans 'Subdivisiones directas' %}"
    data-open-label="{% trans 'Ver datos' %}"
    data-entity-type-label="{% trans 'Tipo' %}"
    data-annotation-label="{% trans 'Anotación' %}"
    data-name-label="{% trans 'Nombre' %}"
    data-official-name-label="{% trans 'Nombre oficial' %}"
    data-official-language-label="{% trans 'Idioma oficial' %}"
    data-capital-label="{% trans 'Capital' %}"
    data-density-label="{% trans 'Densidad' %}"
    data-subdivision-count-label="{% trans 'Número de subdivisiones' %}"
    data-flag-label="{% trans 'Bandera' %}"
    data-coat-label="{% trans 'Escudo' %}"
  ></div>
</section>

<section
  class="stats-country-detail"
  data-stats-country-detail
  data-loading="{% trans 'Cargando país...' %}"
  data-error="{% trans 'No se pudo cargar el país.' %}"
  data-empty="{% trans 'Sin datos' %}"
  data-general-title="{% trans 'Datos generales del país' %}"
  data-children-title="{% trans 'Subdivisiones directas' %}"
  data-open-label="{% trans 'Ver datos' %}"
  data-entity-type-label="{% trans 'Tipo' %}"
  data-annotation-label="{% trans 'Anotación' %}"
  data-name-label="{% trans 'Nombre' %}"
  data-official-name-label="{% trans 'Nombre oficial' %}"
  data-official-language-label="{% trans 'Idioma oficial' %}"
  data-capital-label="{% trans 'Capital' %}"
  data-population-label="{% trans 'Población' %}"
  data-area-label="{% trans 'Terreno' %}"
  data-density-label="{% trans 'Densidad' %}"
  data-subdivision-count-label="{% trans 'Número de subdivisiones' %}"
  data-flag-label="{% trans 'Bandera' %}"
  data-coat-label="{% trans 'Escudo' %}"
  hidden
></section>
{% endblock %}
