{% load i18n %}
<div class="bar-chart">
  {% for row in rows %}
  <div class="bar-row">
    <span class="bar-label">{{ row.label }}</span>
    <div class="bar-track"><span style="width: {{ row.width }}%"></span></div>
    <strong>{{ row.value }}</strong>
  </div>
  {% empty %}
  <p class="empty">{% trans empty %}</p>
  {% endfor %}
</div>
