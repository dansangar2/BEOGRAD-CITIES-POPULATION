{% extends "ciudades_del_mundo/base.html" %}
{% load i18n %}

{% block title %}{% trans "Areas - Ciudades del Mundo" %}{% endblock %}

{% block content %}
<section class="page-head compact">
  <div>
    <p class="eyebrow">{% trans "Datos fuente" %}</p>
    <h1>{% trans "Areas administrativas" %}</h1>
  </div>
</section>

<form class="filters advanced-filters async-table-form" method="get" data-target="#admin-area-table" data-url="{{ table_url }}" data-loading="{% trans 'Cargando tabla...' %}" data-error="{% trans 'La tabla no se pudo cargar. Reintenta en unos segundos.' %}">
  <label>
    {% trans "Buscar" %}
    <input type="search" name="q" placeholder="{% trans 'Buscar por nombre' %}">
  </label>
  <label>
    {% trans "Paises" %}
    <select name="country" multiple data-select2 data-placeholder="{% trans 'Todos los paises' %}">
      {% for country in countries %}
      <option value="{{ country.code }}">{{ country.label }}</option>
      {% endfor %}
    </select>
  </label>
  <label>
    {% trans "Niveles" %}
    <select name="level" multiple data-select2 data-placeholder="{% trans 'Todos los niveles' %}">
      {% for value in "012345" %}
      <option value="{{ value }}">L{{ value }}</option>
      {% endfor %}
    </select>
  </label>
  <label>
    {% trans "Tipo" %}
    <select name="entity_type" multiple data-select2 data-placeholder="{% trans 'Todos los tipos' %}">
      {% for entity_type in entity_types %}
      <option value="{{ entity_type }}">{{ entity_type }}</option>
      {% endfor %}
    </select>
  </label>
  <label>
    {% trans "Fusion" %}
    <select name="city_merge_status" multiple data-select2 data-placeholder="{% trans 'Cualquier fusion' %}">
      {% for value, label in merge_statuses %}
      <option value="{{ value }}">{{ label }}</option>
      {% endfor %}
    </select>
  </label>
  <label>
    {% trans "Padre" %}
    <input name="parent" placeholder="{% trans 'Nombre del padre' %}">
  </label>
  <label>
    {% trans "Poblacion minima" %}
    <input type="number" name="min_pop" min="0">
  </label>
  <label>
    {% trans "Poblacion maxima" %}
    <input type="number" name="max_pop" min="0">
  </label>
  <label>
    {% trans "Area minima" %}
    <input type="number" name="min_area" min="0" step="0.01">
  </label>
  <label>
    {% trans "Area maxima" %}
    <input type="number" name="max_area" min="0" step="0.01">
  </label>
  <label>
    {% trans "Orden" %}
    <select name="sort" data-select2>
      {% for value, label in sort_choices %}
      <option value="{{ value }}">{{ label }}</option>
      {% endfor %}
    </select>
  </label>
  <label>
    {% trans "Filas" %}
    <select name="page_size" data-select2>
      <option value="50">50</option>
      <option value="100">100</option>
      <option value="200">200</option>
    </select>
  </label>
  <div class="filter-actions">
    <button type="submit">{% trans "Filtrar" %}</button>
    <button type="reset" class="quiet">{% trans "Limpiar" %}</button>
  </div>
</form>

<section id="admin-area-table" class="async-table-panel" aria-live="polite">
  <div class="table-loading"><span class="loading-spinner" aria-hidden="true"></span>{% trans "Cargando tabla..." %}</div>
</section>
{% endblock %}
