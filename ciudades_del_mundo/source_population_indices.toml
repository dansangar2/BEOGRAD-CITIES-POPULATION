# Multiplicadores historicos globales para poblacion fuente.
#
# Se aplican al construir NuevoAdminArea cuando una receta define
# source_population_year / population_year / year / year_start, o cuando se
# usa build_new_subdivisions --population-year.
#
# Fuente principal: CityPopulation.de, paginas administrativas o de ciudades
# configuradas en ciudades_del_mundo/subdivisions/*.toml. Los roots se
# completan hacia atras con Our World in Data population.csv cuando hay match.
# Generado/actualizado: 2026-05-28.
# Multiplicador = poblacion de la entidad en ese anio / ultima poblacion
# disponible en la misma fila de CityPopulation.
#
# Las claves son codigos CityPopulation/AdminArea cuando existen; el comentario
# conserva el nombre humano, el nivel aproximado y la URL fuente.
# Si un area fuente no tiene indice directo, el builder busca el indice del
# padre AdminArea mas cercano y finalmente usa 1.

