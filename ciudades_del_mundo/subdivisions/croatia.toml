scrape_schema_version = 2

[[pages]]
source = "cities"
path = ["cities"]
include = { infosection = true, major_subdivision = false, cities = false }

[[pages]]
source = "admin"
path = ["admin"]
# This page has no infosection; the country root comes from cities above.
include = { infosection = false, admin1 = true, admin2 = true }
force_highest_level = 1

[[pages]]
source = "cities"
path = [
  "bjelovarbilogora",
  "brodposavina",
  "dubrovnikneretva",
  "gradzagreb",
  "istra",
  "karlovac",
  "koprivnicakrizevci",
  "krapinazagorje",
  "likasenj",
  "medimurje",
  "osijekbaranja",
  "pozegaslavonija",
  "primorjegorskikotar",
  "sibenikknin",
  "sisakmoslavina",
  "splitdalmacija",
  "varazdin",
  "viroviticapodravina",
  "vukovarsrijem",
  "zadar",
  "zagreb",
]
include = { infosection = true, major_subdivision = true, cities = true }
# County roots (including Grad Zagreb) already come from admin at L1.
# Read municipalities at L2 and settlements at L3; do not follow city districts.
force_highest_level = 2
include_root = false
