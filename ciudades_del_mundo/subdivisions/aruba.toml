name = "Aruba"
country_code = "aruba"
base_url = "https://www.citypopulation.de/en/"
reset_before_import = true
LEGAL_SUBDIVISION = 2

# L0 country -> L1 regions -> L2 cities/urban areas -> L3 zones.
scrape_schema_version = 2

[[pages]]
source = "cities"
path = ["cities"]
include = { infosection = true, major_subdivision = true, cities = true }

[[pages]]
source = "admin"
path = ["admin"]
include = { infosection = true, admin1 = true, admin2 = true }
