include = { infosection = true, major_subdivision = true, cities = true }
force_highest_level = 2


# Bucuresti ya figura como ciudad de rango condado (L2) en admin.
# No existe /localities/bucuresti/: mantener su funcion municipal en L3
# con la misma identidad y metricas. Sus seis sectores administrativos son L4.
[[synthetic_entities]]
code = "RO321_city"
name = "București"
level = 3
parent_code = "RO321"
entity_type = "City"
data_wd = "Q19660"
copy_metrics_from = "RO321"
url = "https://www.citypopulation.de/en/romania/admin/bucurești_ilfov/RO321__bucurești/"

