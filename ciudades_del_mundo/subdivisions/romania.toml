name = "Romania"
country_code = "romania"
LEGAL_SUBDIVISION = 3

scrape_schema_version = 2

[[pages]]
source = "admin"
path = ["admin"]
include = { infosection = true, admin1 = true, admin2 = true }

[[pages]]
source = "cities"
# Regiones L1, condados L2 y comunas/ciudades L3.
