  "haskovo",
  "kardzhali",
  "kyustendil",
  "lovech",
  "montana",
  "pazardzhik",
  "pernik",
  "pleven",
  "plovdiv",
  "razgrad",
  "ruse",
  "shumen",
  "silistra",
  "sliven",
  "smolyan",
  "sofia",
  "sofiacity",
  "starazagora",
  "targovishte",
  "varna",
  "velikotarnovo",
  "vidin",
  "vratsa",
  "yambol",
]
include = { infosection = true, major_subdivision = true, cities = true }
