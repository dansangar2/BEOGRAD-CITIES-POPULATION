name = "France"
country_code = "france"
wikidata_id = "Q142"
base_url = "https://www.citypopulation.de/en/"
reset_before_import = true
LEGAL_SUBDIVISION = 5

# France is split by CityPopulation between Metropolitan France and the
# overseas-department city pages. Keep one real tree:
# France L0 -> Metropolitan/Overseas L1 -> Regions / overseas departments L2 ->
# Departments L3 -> Arrondissements L4 -> Communes L5.

[[synthetic_entities]]
code = "METRO"
name = "Metropolitan France"
level = 1
parent_code = "france"
entity_type = "area"
metric_source_parent_code = "METRO"
metric_source_level = 2

[[synthetic_entities]]
code = "OVERSEAS"
name = "Overseas France"
level = 1
parent_code = "france"
entity_type = "area"
metric_source_codes = ["GUF", "GLP", "MTQ", "MYT", "REU"]

[[parent_overrides]]
match_levels = [2]
parent_code = "METRO"
exclude_codes = ["METRO", "OVERSEAS"]

[[parent_overrides]]
codes = ["GUF", "GLP", "MTQ", "MYT", "REU"]
level = 2
parent_code = "OVERSEAS"

[[pages]]
source = "admin"
path = ["reg/admin"]
lowest_level = 0
include_root = false
table_levels = { admin1 = 2, admin2 = 3 }

