name = "France"
country_code = "france"
wikidata_id = "Q142"
base_url = "https://www.citypopulation.de/en/"
reset_before_import = true
LEGAL_SUBDIVISION = 5

# France is split by CityPopulation between Metropolitan France and five
# overseas-department pages. Keep the real administrative tree as one country:
# France L0 -> Metropolitan/Overseas L1 -> Regions L2 -> Departments L3 ->
# Arrondissements L4 -> Communes L5.

[[synthetic_entities]]
code = "METRO"
name = "Metropolitan France"
level = 1
parent_code = "france"
entity_type = "area"
copy_metrics_from = "france"

[[synthetic_entities]]
code = "OVERSEAS"
name = "Overseas France"
level = 1
parent_code = "france"
entity_type = "area"
metric_source_codes = ["GUF", "GLP", "MTQ", "MYT", "REU"]

[[parent_overrides]]
match_levels = [2]
parent_code = "METRO"
exclude_codes = ["METRO", "OVERSEAS"]

[[parent_overrides]]
codes = ["GUF", "GLP", "MTQ", "MYT", "REU"]
level = 3
parent_code = "OVERSEAS"

[[root_metric_sources]]
path = "france/cities/guyane"
code = "GUF"

[[root_metric_sources]]
path = "france/cities/guadeloupe"
code = "GLP"

[[root_metric_sources]]
path = "france/cities/martinique"
code = "MTQ"

[[root_metric_sources]]
path = "france/cities/mayotte"
code = "MYT"

[[root_metric_sources]]
path = "france/cities/reunion"
code = "REU"

[[pages]]
source = "cities"
path = ["cities"]
lowest_level = 0

[[pages]]
source = "admin"
path = ["reg/admin"]
lowest_level = 2

