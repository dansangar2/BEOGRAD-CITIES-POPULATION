name = "North Macedonia"
country_code = "northmacedonia"
base_url = "https://www.citypopulation.de/en/"
LEGAL_SUBDIVISION = 2

scrape_schema_version = 2

[[pages]]
source = "admin"
path = ["admin"]
include = { infosection = true, admin1 = true, admin2 = true }

[[pages]]
source = "cities"
# Regiones L1, municipios L2 y localidades L3.
path = [
  "istocen",
  "jugoistocen",
  "jugozapaden",
  "pelagoniski",
  "poloski",
  "severoistocen",
  "skopski",
  "vardarski",
]
include = { infosection = true, major_subdivision = true, cities = true }
force_highest_level = 1
