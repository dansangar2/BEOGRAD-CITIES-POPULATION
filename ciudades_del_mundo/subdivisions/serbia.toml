scrape_schema_version = 2

[[pages]]
source = "cities"
path = ["cities"]
include = { infosection = true, major_subdivision = false, cities = false }

[[pages]]
source = "admin"
path = ["admin"]
include = { infosection = false, admin1 = true, admin2 = true }
force_highest_level = 1

[[pages]]
source = "cities"
path = [
  "bor",
  "branicevo",
  "gradbeograd",
  "jablanica",
  "juznabacka",
  "juznibanat",
  "kolubara",
  "macva",
  "moravica",
  "nis",
  "pcinja",
  "pirot",
  "podunavlje",
  "pomoravlje",
  "rasina",
  "raska",
  "severnabacka",
  "severnibanat",
  "srednjibanat",
  "srem",
  "sumadija",
  "toplica",
  "zajecar",
  "zapadnabacka",
  "zlatibor",
]
include = { infosection = true, major_subdivision = true, cities = true }
force_highest_level = 2
include_root = false
# Obilic (Bojnik) is distinct from Obiliq in Kosovo.
# https://www.wikidata.org/wiki/Q2749459
wikidata_overrides = { "24382" = "Q2749459" }

[[pages]]
source = "admin"
path = ["https://www.citypopulation.de/en/kosovo/admin/"]
include = { infosection = false, admin1 = true, admin2 = true }
force_highest_level = 1
# Add the seven districts once, without adding their municipalities or localities again.
sum_to_root = true

[[pages]]
source = "cities"
path = ["https://www.citypopulation.de/en/kosovo/cities/"]
include = { infosection = false, major_subdivision = false, cities = true }
force_highest_level = 3

