LEGAL_SUBDIVISION = 2

scrape_schema_version = 2

[[pages]]
source = "cities"
path = ["cities"]
include = { infosection = true, major_subdivision = false, cities = false }

[[pages]]
source = "admin"
path = ["admin"]
include = { infosection = true, admin1 = true, admin2 = true }

[[pages]]
source = "cities"
# Departamento L1 > municipio L2 > localidad L3.
# La tabla nacional de ciudades solo recoge las mayores de 10 000 habitantes.
path = [
  "atlantida",
  "choluteca",
  "colon",
  "comayagua",
  "copan",
  "cortes",
  "elparaiso",
  "franciscomorazan",
  "graciasadios",
  "intibuca",
  "islasdelabahia",
  "lapaz",
  "lempira",
  "ocotepeque",
  "olancho",
  "santabarbara",
  "valle",
  "yoro",
]
# Los municipios de estas paginas solo aportan contexto para enlazar las
# localidades; sus cifras de 2013 no sustituyen las de admin (2023).
include = { infosection = false, major_subdivision = false, cities = true }
force_highest_level = 3
parent_level = 2
preserve_source_codes = true
