[[pages]]
source = "double"
path = [
  "benimellalkhenifra",
  "draatafilalet",
  "fesmeknes",
  "grandcasablancasettat",
  "guelmimouednoun",
  "marrakechsafi",
  "oriental",
  "rabatsalekenitra",
  "soussmassa",
  "tangertetouanalhoceima",
]
# The first table repeats provinces/prefectures and is only parent context.
# Persist the second table as L4 urban places while keeping its province parent.
lowest_level = 2
include_tables = ["ts"]
table_levels = { ts = 4 }
