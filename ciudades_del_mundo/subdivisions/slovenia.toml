  "goriska",
  "jugovzhodnaslovenija",
  "koroska",
  "obalnokraska",
  "osrednjeslovenska",
  "podravska",
  "pomurska",
  "posavska",
  "primorskonotranjska",
  "savinjska",
  "zasavska",
