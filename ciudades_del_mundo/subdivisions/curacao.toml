name = "Curaçao"
country_code = "curacao"
base_url = "https://www.citypopulation.de/en/"
reset_before_import = true
LEGAL_SUBDIVISION = 1

# L0 country -> L1 cities/places -> L2 geozones -> L3 neighborhoods.
[visual_assets.flag]
remote_url = "https://www.citypopulation.de/images/flags/curacao.svg"
source = "config"

scrape_schema_version = 2

[[pages]]
source = "cities"
path = ["cities"]
include = { infosection = true, major_subdivision = true, cities = true }

[[pages]]
source = "admin"
path = ["admin"]
include = { infosection = true, admin1 = true, admin2 = true }

# /curacao/cities/ exposes places, but several place rows lack stable ids and
# some ids collide with geozone/neighborhood ids from /curacao/admin/.  Keep
# geozones complete by declaring the place containers and reparenting geozones
# after the admin scrape.
[[synthetic_entities]]
code = "city-willemstad"
name = "Willemstad"
level = 1
parent_code = "curacao"
entity_type = "City"
metric_source_codes = ["35", "55", "33", "21", "29", "03", "45", "50", "57", "18", "36", "26", "48", "17", "30", "61", "59", "39", "41", "37", "25", "22", "13", "32", "40", "62", "23", "49", "44", "65", "51", "27", "54", "16", "52", "19", "20", "58", "34", "56", "38", "53", "63", "42", "15", "14", "64", "60", "24", "31", "05", "09", "28", "47", "43"]

