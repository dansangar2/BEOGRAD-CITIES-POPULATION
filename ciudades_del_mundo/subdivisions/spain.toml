name = "España"
country_code = "spain"
base_url = "https://www.citypopulation.de/en/"
wikidata_id = "Q29"

LEGAL_SUBDIVISION = 3

[representation]
level = 2
total = 350
min = 2
min_exceptions = { spain_51 = 1, spain_52 = 1 }
max_exceptions = { spain_51 = 1, spain_52 = 1 }
system = "dhondt"

# Assets nacionales de reserva para que /countries y la Ficha muestren España
# aunque aún no se haya hecho la siembra Wikidata/Commons.
[visual_assets.flag]
wikidata_id = "Q29"
commons_filename = "Flag of Spain.svg"
source = "config"

[visual_assets.coat]
wikidata_id = "Q29"
commons_filename = "Coat of Arms of Spain.svg"
source = "config"

[[pages]]
source = "admin"
# Regiones/CCAA y provincias desde la división administrativa oficial.
path = ["admin"]
lowest_level = 0

[[pages]]
source = "table"
# Comunidades con provincias explícitas: CCAA L1, provincias L2, municipios L3.
path = [
  "andalucia",
  "aragon",
  "canarias",
  "castillalamancha",
  "castillayleon",
  "cataluna",
  "comunitatvalenciana",
  "extremadura",
  "galicia",
  "paisvasco",
]
lowest_level = 1

[[pages]]
source = "table"
# Comunidades uniprovinciales: la raíz de la página representa la provincia
# L2 ya creada por /spain/admin; los municipios quedan en L3.
path = [
  "asturias",
  "cantabria",
  "illesbalears",
  "larioja",
  "madrid",
  "murcia",
  "navarra",
]
lowest_level = 2

[[pages]]
source = "table"
# Ceuta y Melilla aparecen en /admin como ciudad autónoma L1 y como entidad
# provincial L2.  La página propia se ancla en la L2 para que su municipio sea L3.
path = [
  "ceuta",
  "melilla",
]
lowest_level = 2

