name = "Germany"
country_code = "germany"
wikidata_id = "Q183"
LEGAL_SUBDIVISION = 2

scrape_schema_version = 2

[[pages]]
source = "cities"
path = ["cities"]
include = { infosection = true, major_subdivision = false, cities = false }

[[pages]]
source = "admin"
path = ["admin"]
include = { infosection = true, admin1 = true, admin2 = true }

# Estados L1 > distritos L2 > municipios L3; conservar cada funcion territorial.
[[pages]]
source = "cities"
path = [
  "badenwurttemberg",
  "bayern",
  "berlin",
  "brandenburg",
  "bremen",
  "hamburg",
  "hessen",
  "mecklenburgvorpommern",
  "niedersachsen",
  "nordrheinwestfalen",
  "rheinlandpfalz",
  "saarland",
  "sachsen",
  "sachsenanhalt",
  "schleswigholstein",
  "thuringen",
]
force_highest_level = 1
preserve_source_codes = true
include = { infosection = true, major_subdivision = true, cities = true }

# Asentamientos censales de mas de 300 habitantes; los distritos son contexto.
[[pages]]
source = "cities"
path = [
  "settlements/badenwurttemberg",
  "settlements/bayern",
  "settlements/berlin",
  "settlements/brandenburg",
  "settlements/bremen",
  "settlements/hamburg",
  "settlements/hessen",
  "settlements/mecklenburgvorpommern",
  "settlements/niedersachsen",
  "settlements/nordrheinwestfalen",
  "settlements/rheinlandpfalz",
  "settlements/saarland",
  "settlements/sachsen",
  "settlements/sachsenanhalt",
  "settlements/schleswigholstein",
  "settlements/thuringen",
]
force_highest_level = 4
parent_level = 3
table_levels = { tl = 2, ts = 4 }
preserve_source_codes = true
include = { infosection = false, major_subdivision = false, cities = true }

# Subdivisiones urbanas: distritos municipales L4 y barrios/zonas estadisticas L5.
[[pages]]
source = "admin"
path = [
  "berlin/admin",
  "bremen/admin",
  "dortmund/admin",
  "dresden/admin",
  "duisburg/admin",
  "dusseldorf/admin",
  "essen/admin",
  "frankfurt/admin",
  "hamburg/admin",
  "hannover/admin",
  "koln/admin",
  "leipzig/admin",
  "munchen/admin",
  "nurnberg/admin",
  "stuttgart/admin",
]
force_highest_level = 4
preserve_source_codes = true
include = { infosection = false, major_subdivision = true, minor_subdivision = true }

# La pagina general de Munich tiene M15 fuera de tbody: leer su ficha fuente.
