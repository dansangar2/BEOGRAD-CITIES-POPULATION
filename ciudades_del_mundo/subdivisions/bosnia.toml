name = "Bosnia and Herzegovina"
country_code = "bosnia"
LEGAL_SUBDIVISION = 3

scrape_schema_version = 2
# This urban aggregate overlaps the unified city; it is not a subdivision.
exclude_entity_codes = ["209xxx"]

[[pages]]
source = "citiesadmin"
# País raíz + entidades/cantones mezclados en table#tl.
path = ["cities"]
include = { infosection = true, major_subdivision = true, minor_subdivision = true, cities = true }
# National urban summaries are settlements, not municipalities.
table_levels = { cities = 4 }

[[pages]]
source = "cities"
# Cantones/entidades L2, municipios L3 y localidades L4.
path = [
  "bosanskopodrinjski",
  "hercegovackoneretvanski",
  "kanton10",
  "posavski",
  "sarajevo",
  "srednjobosanski",
  "tuzlanski",
  "unskosanski",
  "zapadnohercegovacki",
  "zenickodobojski",
]
include = { infosection = true, major_subdivision = true, cities = true }
force_highest_level = 2

[[pages]]
source = "cities"
path = ["republikasrpska"]
include = { infosection = true, major_subdivision = true, cities = true }
# L1 is the national entity (2111); L2 is its canton-equivalent role (200).
force_highest_level = 2
root_code = "200"
root_parent_code = "2111"
table_levels = { major_subdivision = 3, cities = 4 }

[[pages]]
source = "cities"
path = ["brcko"]
# Keep only the municipality and its settlements; the district exists at L1.
include = { infosection = false, major_subdivision = true, cities = true }
force_highest_level = 3

[[parent_overrides]]
codes = ["30163"]
parent_code = "6871"
level = 3

[[parent_overrides]]
# Los cantones pertenecen a Federacija Bosna i Hercegovina.
codes = ["6755", "6756", "6761", "6757", "6758", "6754", "6759", "6760", "6762", "6763"]
parent_code = "2112"

