  "hercegovackoneretvanski",
  "kanton10",
  "posavski",
  "republikasrpska",
  "sarajevo",
  "srednjobosanski",
  "tuzlanski",
  "unskosanski",
  "zapadnohercegovacki",
  "zenickodobojski",
]
include = { infosection = true, major_subdivision = true, cities = true }
