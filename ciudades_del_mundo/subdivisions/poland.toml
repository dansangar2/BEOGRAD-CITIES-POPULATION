name = "Poland"
country_code = "poland"
base_url = "https://www.citypopulation.de/en/"
LEGAL_SUBDIVISION = 3

scrape_schema_version = 2

[[pages]]
source = "admin"
path = ["admin"]
include = { infosection = true, admin1 = true, admin2 = true }

[[pages]]
source = "admin"
# Voivodatos L1, condados L2 y comunas L3.
path = [
  "dolnoslaskie/admin",
  "kujawsko_pomorskie/admin",
  "lubelskie/admin",
  "lubuskie/admin",
  "lodzkie/admin",
  "malopolskie/admin",
  "mazowieckie/admin",
  "opolskie/admin",
  "podkarpackie/admin",
  "podlaskie/admin",
  "pomorskie/admin",
  "slaskie/admin",
  "swietokrzyskie/admin",
  "warminsko_mazurskie/admin",
  "wielkopolskie/admin",
  "zachodniopomorskie/admin",
]
include = { infosection = true, admin1 = true, admin2 = true }
force_highest_level = 1

[[pages]]
source = "cities"
# Página de towns por voivodato; se persiste solo ts como lugar L4.
path = [
  "dolnoslaskie",
  "kujawsko_pomorskie",
  "lubelskie",
  "lubuskie",
  "lodzkie",
  "malopolskie",
  "mazowieckie",
  "opolskie",
  "podkarpackie",
  "podlaskie",
  "pomorskie",
  "slaskie",
  "swietokrzyskie",
  "warminsko_mazurskie",
  "wielkopolskie",
  "zachodniopomorskie",
]
include = { infosection = true, major_subdivision = true, cities = true }
force_highest_level = 1

[[pages]]
source = "cities"
# Localidades por subregión/urban county: comunas L3 como contexto y lugares L4.
path = ["localities/jeleniogorski"]
include = { infosection = true, major_subdivision = true, cities = true }
force_highest_level = 3
