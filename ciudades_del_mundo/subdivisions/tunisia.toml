name = "Tunisia"
country_code = "tunisia"
wikidata_id = "Q948"
base_url = "https://www.citypopulation.de/en/"
reset_before_import = true
LEGAL_SUBDIVISION = 3

# L0 country -> L1 governorates -> L2 delegations -> L3 municipalities.
# /tunisia/mun/admin repeats governorates as parent context; persist only municipalities.
scrape_schema_version = 2

[[pages]]
source = "admin"
path = ["admin"]
include = { infosection = true, admin1 = true, admin2 = true }

[[pages]]
source = "admin"
path = ["mun/admin"]
include = { infosection = true, admin1 = true, admin2 = true }
